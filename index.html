<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finodex Forms — Embed demo</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
      }
      .demo-section {
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 24px;
        background: #fafafa;
      }
      h1 { margin-top: 0; }
      h2 { font-size: 16px; color: #666; margin-bottom: 12px; }
      code { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
    </style>
  </head>
  <body>
    <h1>Finodex Forms — embed demo</h1>

    <div class="demo-section">
      <h2>Auto-init (data attributes)</h2>
      <p style="font-size: 13px; color: #777;">
        Drop a <code>&lt;div&gt;</code> with <code>data-finodex-form</code> +
        <code>data-finodex-org</code> on any page and include the script.
      </p>
      <div
        data-finodex-form="contact"
        data-finodex-org="1"
        data-finodex-api="http://localhost:5000"
      ></div>
    </div>

    <div class="demo-section">
      <h2>Programmatic API</h2>
      <p style="font-size: 13px; color: #777;">
        <code>FinodexForms.render({ container, slug, orgId, apiBase, onSuccess })</code>
      </p>
      <div id="programmatic"></div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        if (!window.FinodexForms) return;
        window.FinodexForms.render({
          container: document.getElementById("programmatic"),
          slug: "contact",
          orgId: 1,
          apiBase: "http://localhost:5000",
          onSuccess: (r) => console.log("[demo] submitted:", r),
        });
      });
    </script>
  </body>
</html>
