<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finodex Forms — embed test</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 640px;
        margin: 40px auto;
        padding: 0 20px;
        color: #1a1a1a;
      }
      h1 { margin-top: 0; }
      h2 { font-size: 15px; color: #666; margin: 24px 0 12px; text-transform: uppercase; letter-spacing: .04em; }
      .panel {
        border: 1px solid #e2e2e2;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 24px;
        background: #fafafa;
      }
      .controls { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; align-items: center; margin-bottom: 14px; }
      .controls label { font-size: 13px; color: #555; }
      .controls input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
      button {
        padding: 8px 16px; border: 0; border-radius: 6px; background: #2563eb;
        color: #fff; font-size: 14px; cursor: pointer;
      }
      button:hover { background: #1d4ed8; }
      code { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
      .hint { font-size: 12px; color: #888; }
    </style>
  </head>
  <body>
    <h1>Finodex Forms — embed test</h1>
    <p class="hint">
      Served statically; the embed fetches its schema from the API base below.
      Make sure the backend is running and a form with the given org + slug exists.
    </p>

    <div class="panel">
      <h2>Programmatic render</h2>
      <div class="controls">
        <label for="apiBase">API base</label>
        <input id="apiBase" value="http://localhost:4000" />
        <label for="orgId">Org ID</label>
        <input id="orgId" value="1" />
        <label for="slug">Slug</label>
        <input id="slug" value="contact" />
      </div>
      <button id="load">Load form</button>
      <div id="target" style="margin-top: 18px;"></div>
    </div>

    <div class="panel">
      <h2>Auto-init (data attributes)</h2>
      <p class="hint">
        Rendered on page load from <code>data-finodex-*</code> attributes.
      </p>
      <div
        data-finodex-form="contact"
        data-finodex-org="1"
        data-finodex-api="http://localhost:4000"
      ></div>
    </div>

    <script src="./dist/finodex-forms.js"></script>
    <script>
      let dispose = null;
      document.getElementById("load").addEventListener("click", () => {
        if (dispose) dispose();
        dispose = window.FinodexForms.render({
          container: document.getElementById("target"),
          slug: document.getElementById("slug").value.trim(),
          orgId: document.getElementById("orgId").value.trim(),
          apiBase: document.getElementById("apiBase").value.trim(),
          onSuccess: (r) => console.log("[test] submitted:", r),
          onError: (e) => console.error("[test] error:", e),
        });
      });
    </script>
  </body>
</html>
